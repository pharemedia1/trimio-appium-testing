# ============================================================================
# Trimio Automation - framework configuration
# Any key here can be overridden at runtime via:
#   -Dkey=value           (system property)        e.g. -Dheadless=false
#   ENV VAR (UPPER_SNAKE)  e.g. BASE_URL=...        (baseUrl -> BASE_URL)
# ============================================================================

# Trimio web portal (Flutter Web, ADMIN + VENDOR only) ---------------------
# Serve it from the frontend repo, then point web.baseUrl at whatever port it prints:
#   cd ~/StudioProjects/trimio/frontend
#   flutter run -d chrome -t lib/main_web.dart
# In local dev the API needs CORS; until it sends the headers, launch Chrome with
#   --web-browser-flag "--disable-web-security"
web.baseUrl=http://localhost:8080
# Desktop viewport: below 900px the portal shell collapses its sidebar into a drawer.
web.viewportWidth=1440
web.viewportHeight=900

# Trimio backend (Node/Express) -------------------------------------------
# Used by the API-level checks — notably the staff-only web-portal block, which is
# enforced on the server (403 WEB_PORTAL_NOT_AVAILABLE) and can only be tested by
# controlling the Origin header. The emulator reaches the host at 10.0.2.2.
api.baseUrl=http://localhost:3000

# Browser ------------------------------------------------------------------
# browser: chromium | firefox | webkit
browser=chromium
headless=true
# slowMo: milliseconds to slow each action (useful for debugging; 0 = off)
slowMo=0

# Mobile-web emulation ------------------------------------------------------
# device: none | pixel7 | iphone14
#   none     -> desktop context using the `browser` above
#   pixel7   -> mobile emulation, forces chromium engine
#   iphone14 -> mobile emulation, forces webkit engine
# Override per run, e.g.: -Ddevice=iphone14   (DEVICE=iphone14 also works)
device=none

# Timeouts (milliseconds) --------------------------------------------------
timeout=30000

# Test execution -----------------------------------------------------------
# retryCount: how many times a failed test is retried (flaky-test absorption)
retryCount=1

# Firebase (social sign-in tests) ------------------------------------------
# /auth/registerGoogleUser verifies the providerToken (SOCIAL_AUTH_ENFORCED=true), so the
# social-registration tests mint a REAL Firebase ID token via accounts:signUp. That needs
# only the project's web API key — the same one the app ships in firebase_options.dart.
# Left BLANK on purpose so no key lives in git. Supply it at run time:
#   -Dfirebase.webApiKey=…   (or FIREBASE_WEBAPIKEY=…)
# Without it the social tests skip with an explanation rather than failing.
firebase.webApiKey=

# The GPS fix pushed to an emulator before every session. Style-Me-Now needs a location: without
# one the app raises a manual-address dialog and its tests skip. `adb emu geo fix` sets a SINGLE
# fix rather than a standing location and does not survive a long run, so AppiumDriverFactory
# re-applies it per session. Dallas, because the active jurisdiction is Texas.
device.geoFix.enabled=true
device.geoFix.lat=32.7767
device.geoFix.lon=-96.7970

# Runtime permissions granted before every session. autoGrantPermissions only covers a fresh
# install; clearing app data revokes them, and the next cold start comes up behind
# GrantPermissionsActivity -- which fails session creation outright, because the foreground
# activity then belongs to another package and UiAutomator2 reports "Cannot start the
# application". Verified: it skipped the whole paired suite on a device where the app launched
# perfectly by hand.
device.grantPermissions.enabled=true
device.grantPermissions=android.permission.POST_NOTIFICATIONS,android.permission.ACCESS_FINE_LOCATION,android.permission.ACCESS_COARSE_LOCATION

# Free space on the emulator before a suite, by REBOOTING it when it is low.
#
# A run opens one session per test and session creation needs disk: UiAutomator2 installs its
# instrumentation server as part of opening one. At 92% full that hung for 2022 seconds and
# failed with "Could not start a new session", which TestNG reported as a 73rd test failing with
# no test behind it.
#
# NEITHER A REBOOT NOR A TRIM RECLAIMS SPACE. `pm trim-caches` reclaimed 0, 0, 1 and 1 MB across
# four consecutive regressions. A reboot looked like it reclaimed 435 MB, but that reading came
# minutes after the app had been uninstalled and a failed 220 MB install had left its staging
# behind; measured on a steady-state device a reboot reclaims -12 MB.
#
# The reboot is kept for the INSTRUMENTATION, not the disk: it has twice revived a UiAutomator2
# server that had stopped initialising (ECONNREFUSED on the system port, app installed,
# permissions granted), each time after a whole suite had been lost to it. Removing the
# UiAutomator2 APKs so Appium reinstalled them was tried first and did not help.
#
# rebootBelowMb   below this, reboot before the suite starts (~35s). Low free space is the
#                 condition under which that instrumentation failure has appeared, so it is used
#                 as the trigger. It is a proxy, not a cause.
# warnBelowMb     below this after a reboot, the partition is simply too small. Grow it, or
#                 install the 147 MB release APK rather than the 220 MB debug one.
#
# ONLY called before any session exists (@BeforeSuite, and before a paired class opens its two
# sessions). Rebooting with a session open strands the driver.
device.reclaim.enabled=true
device.reclaim.rebootBelowMb=700
device.reclaim.warnBelowMb=500
